openapi: 3.0.3
info:
  title: DevOps Secrets Manager API
  version: 1.0.0
  description: |
    Manage encrypted secrets organised into vaults and environments, with per-vault roles and
    an audit log.

    Field names are snake_case. Timestamps are RFC 3339. Every error response has the
    `Error` shape. The web app reaches this API under `/api` (proxied by Vite or nginx); the
    API itself has no prefix.

    Callers with no role on a vault get `404` for the vault and everything in it, so IDs that
    belong to other teams are never confirmed. Callers who can see a vault but whose role lacks
    a permission get `403`.
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development API
  - url: http://localhost:5173/api
    description: Local web app proxy

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: Organizations
  - name: Vaults
  - name: Environments
  - name: Secrets
  - name: Members
  - name: Service tokens
  - name: Audit
  - name: Dashboard
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Pings the database and reports the schema version. Answers 503 when the database is unreachable or a migration is dirty.
      operationId: getHealth
      security: []
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register
      description: Creates the account and the user's own organization, and sends a verification email. Login is refused until the email is verified. Passwords must be 12 to 72 bytes, use at least 5 different characters, not be a common password (including with digits or symbols added or letters swapped for digits) and not contain the user's name or email; failures return 400 `validation_failed` with the reason.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: An account with this email already exists (`user_already_exists`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify email
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: Missing, invalid, used or expired token (`invalid_verification`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Resend verification email
      description: |
        Emails a new verification link if the address belongs to an account that is not verified
        yet; earlier links stop working. The response is the same for unknown and already
        verified addresses, so it cannot be used to discover accounts. Limited to 3 requests per
        address and 10 per client IP per hour.
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '202':
          description: Accepted; an email is sent only if the account needs verifying
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password reset
      description: |
        Emails a single-use link to `/reset-password?token=...` that expires in one hour, if the
        address belongs to an account; earlier reset links stop working. The response is the same
        for unknown addresses. Limited to 3 requests per address and 10 per client IP per hour.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '202':
          description: Accepted; an email is sent only if the account exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password
      description: |
        Sets a new password with a reset token, marks the email verified, clears any login
        lockout and signs out every session. The new password must meet the password policy; a
        rejected password does not use up the token. Audited as `user.password_reset`.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password, minLength: 12, maxLength: 72 }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Password reset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: Missing fields, a password that fails the policy (`validation_failed`), or an invalid, expired or used token (`invalid_reset_token`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      description: |
        Returns an access token and a refresh token. With `use_cookie: true` (the web app) the
        refresh token is set as an `HttpOnly`, `SameSite=Strict` cookie (`__Host-dsm_refresh`, or
        `dsm_refresh` in development) and left out of the body, so page scripts cannot read it.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong email or password (`invalid_credentials`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Email not verified yet (`email_not_verified`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh tokens
      description: |
        Exchanges a refresh token for a new access token and a new refresh token. The old refresh
        token is revoked. The token is read from the body, or from the refresh cookie when the body
        has none; a cookie is answered with a new cookie. A failed refresh does not change cookies.
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid, expired or revoked refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      description: Revokes the refresh token from the body, or from the refresh cookie, and clears the cookie.
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '204':
          description: Logged out
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Unknown refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [Authentication]
      summary: Current user
      operationId: getMe
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: The authenticated user and their organizations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password
      description: |
        Sets a new password and signs out every other session of the user by revoking their
        refresh tokens; the session making the request stays signed in. Access tokens already
        issued to other sessions stay valid until they expire (at most 15 minutes). Audited as
        `user.password_changed` with the number of sessions ended.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: Missing fields, a new password that fails the password policy (`validation_failed`), or wrong current password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions:
    get:
      tags: [Authentication]
      summary: List sessions
      description: |
        The caller's active sessions: logins whose refresh token is still valid, most recently
        used first. `current` marks the session the access token belongs to.
      operationId: listSessions
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Authentication]
      summary: Sign out a session
      description: |
        Revokes the session's refresh token, so it cannot get new access tokens (an access token
        it already holds stays valid for at most 15 minutes). Revoking the current session also
        clears the refresh cookie. Audited as `user.sessions_revoked`.
      operationId: revokeSession
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '204':
          description: Signed out
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/sessions/revoke-others:
    post:
      tags: [Authentication]
      summary: Sign out everywhere else
      description: Revokes every session of the caller except the current one. Audited as `user.sessions_revoked`.
      operationId: revokeOtherSessions
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Sessions signed out
          content:
            application/json:
              schema:
                type: object
                required: [sessions_revoked]
                properties:
                  sessions_revoked: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orgs:
    get:
      tags: [Organizations]
      summary: List organizations
      description: Organizations the caller belongs to, with their role, ordered by name.
      operationId: listOrganizations
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orgs/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
    get:
      tags: [Organizations]
      summary: Get organization
      operationId: getOrganization
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organizations]
      summary: Rename organization
      description: Requires the owner or admin role in the organization.
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrganizationRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orgs/{id}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
    get:
      tags: [Organizations]
      summary: List organization members
      description: Any member can see who else is in the organization.
      operationId: listOrganizationMembers
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrganizationMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orgs/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Organizations]
      summary: Change organization role
      description: Requires owner or admin. Only owners can grant or change the owner role, and the last owner cannot be demoted.
      operationId: updateOrganizationMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Organizations]
      summary: Remove organization member
      description: Requires owner or admin. Also removes the person from every vault in the organization. Callers cannot remove themselves, only owners can remove an owner, and the last owner stays.
      operationId: removeOrganizationMember
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orgs/{id}/invites:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
    get:
      tags: [Organizations]
      summary: List open invitations
      description: Invitations not yet accepted, revoked or expired. Requires owner or admin.
      operationId: listInvites
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Organizations]
      summary: Invite by email
      description: |
        Requires owner or admin; only owners can invite another owner. Emails a single-use link
        that expires in 7 days (logged instead in development without SMTP). Inviting the same
        address again replaces the earlier link. `email_sent` is false when the invitation was
        stored but could not be delivered.
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '201':
          description: Invitation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateInviteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The person is already a member (`already_member`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orgs/{id}/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - name: inviteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Organizations]
      summary: Revoke invitation
      description: Requires owner or admin. The link stops working.
      operationId: revokeInvite
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '204':
          description: Revoked
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invites/lookup:
    post:
      tags: [Organizations]
      summary: Look up an invitation
      description: Describes an open invitation for the accept page. The token is sent in the body so it never appears in URLs or access logs. No authentication.
      operationId: lookupInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteTokenRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteLookup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown, expired, revoked or used invitation (`invalid_invite`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /invites/accept:
    post:
      tags: [Organizations]
      summary: Accept an invitation
      description: Adds the logged-in user to the organization. The account's email must match the invitation. New users accept by registering with `invite_token` instead.
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteTokenRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The invitation is for another address (`invite_email_mismatch`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown, expired, revoked or used invitation (`invalid_invite`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already a member (`already_member`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /vaults:
    get:
      tags: [Vaults]
      summary: List vaults
      description: Vaults the caller is a member of, plus every vault in organizations they own or administer. Newest first.
      operationId: listVaults
      parameters:
        - name: organizationId
          in: query
          description: Only include this organization (snake_case `organization_id` is also accepted)
          schema: { type: string, format: uuid }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Vaults
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vault' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Vaults]
      summary: Create vault
      description: Requires the owner, admin or developer role in the organization. The creator becomes the vault's owner. Without `organization_id` the caller's first organization is used.
      operationId: createVault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVaultRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vault' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /vaults/{id}:
    parameters:
      - $ref: '#/components/parameters/VaultIdPath'
    get:
      tags: [Vaults]
      summary: Get vault
      description: Requires read permission.
      operationId: getVault
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Vault
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vault' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Vaults]
      summary: Update vault
      description: Requires write permission.
      operationId: updateVault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVaultRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vault' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Vaults]
      summary: Delete vault
      description: Requires delete permission (owners only). The vault is soft-deleted.
      operationId: deleteVault
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vaults/{id}/rotate-key:
    parameters:
      - $ref: '#/components/parameters/VaultIdPath'
    post:
      tags: [Vaults]
      summary: Rotate the vault's data key
      description: |
        Generates a new data key for the vault and re-encrypts every secret value under it in one
        transaction; the old key is discarded. Use it after a suspected exposure of the vault's
        data. Requires the manage-members permission (owners and admins). Audited as
        `vault.key_rotated`.
      operationId: rotateVaultKey
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultKeyRotation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vaults/{vault_id}/envs:
    parameters:
      - name: vault_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Environments]
      summary: List environments
      description: Requires read permission. Newest first.
      operationId: listEnvironments
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Environments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Environment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Environments]
      summary: Create environment
      description: Requires write permission.
      operationId: createEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvironmentRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
        '400':
          description: Invalid body or name (`invalid_name`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /envs/{id}:
    parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
    get:
      tags: [Environments]
      summary: Get environment
      description: Requires read permission on the environment's vault.
      operationId: getEnvironment
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Environment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Environments]
      summary: Update environment
      description: Requires write permission.
      operationId: updateEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvironmentRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Environments]
      summary: Delete environment
      description: Requires write permission. The environment is soft-deleted.
      operationId: deleteEnvironment
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /envs/{id}/secrets:
    parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
    get:
      tags: [Secrets]
      summary: List secrets
      description: Returns metadata only, never values. Requires read permission.
      operationId: listSecrets
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Secrets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SecretMetadata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Secrets]
      summary: Create secret
      description: Requires write permission. The value is encrypted with the vault's data key.
      operationId: createSecret
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSecretRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretMetadata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /envs/{id}/export:
    parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
    post:
      tags: [Secrets]
      summary: Export environment values
      description: |
        Decrypts every value in the environment, for downloading as a `.env` file. Requires reveal
        permission. Audited once as `env.exported` with the key names.
      operationId: exportEnvironment
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Decrypted values
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: array
                    items: { $ref: '#/components/schemas/ExportedSecret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /envs/{id}/import:
    parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
    post:
      tags: [Secrets]
      summary: Import values
      description: |
        Creates keys that do not exist. With `overwrite`, existing keys get the new value unless it
        is the same (no new version is added then); otherwise they are skipped. With `dry_run`
        nothing is written and the response is a preview. Requires write permission. Each key is
        written separately and audited as usual, and a real import adds one `env.imported` event;
        if a write fails part-way, the keys before it stay imported.
      operationId: importEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secrets]
              properties:
                secrets:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$', maxLength: 255 }
                      value: { type: string, format: password }
                overwrite: { type: boolean, description: Update existing keys (default false) }
                dry_run: { type: boolean, description: Only report what would happen (default false) }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: What was (or would be) done with each key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /envs/{id}/copy-from:
    parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
    post:
      tags: [Secrets]
      summary: Copy values from another environment
      description: |
        Copies the named keys (or all of them) from another environment of the same vault, using
        the same rules as an import: missing keys are created, existing ones are updated only with
        `overwrite`, and identical values are left alone. Requires write permission on the vault
        and reveal permission, because the source values are decrypted; the read is audited on the
        source as `env.exported` and the write as `env.imported`.
      operationId: copySecrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_environment_id]
              properties:
                source_environment_id: { type: string, format: uuid }
                keys:
                  type: array
                  maxItems: 500
                  items: { type: string }
                  description: Keys to copy; omit or leave empty to copy them all
                overwrite: { type: boolean }
                dry_run: { type: boolean }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: What was (or would be) done with each key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400':
          description: Missing source, the same environment, a different vault, or no matching keys (`validation_failed`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /envs/{id}/tokens:
    parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
    get:
      tags: [Service tokens]
      summary: List service tokens
      description: Active tokens for the environment (never their values). Requires manage-members permission on the vault.
      operationId: listServiceTokens
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Service tokens]
      summary: Create a service token
      description: Issues a read-only token for this environment. The `token` value is returned only in this response; the API stores a SHA-256 hash. Requires manage-members permission on the vault.
      operationId: createServiceToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceTokenRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedServiceToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Service tokens]
      summary: Revoke a service token
      operationId: revokeServiceToken
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '204':
          description: Revoked
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /token/secrets:
    get:
      tags: [Service tokens]
      summary: Read secrets with a service token
      description: Returns every secret in the token's environment. Authenticate with `Authorization Bearer dsm_st_...`. Each call is audited as `env.exported` by `token:<name>`. Responses are marked `Cache-Control no-store`.
      operationId: readTokenSecrets
      security:
        - serviceToken: []
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenSecrets' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /secrets/{id}:
    parameters:
      - $ref: '#/components/parameters/SecretIdPath'
    put:
      tags: [Secrets]
      summary: Update secret
      description: Requires write permission. Omit `value` to keep the stored value and change only metadata; description, rotation interval, expiry and metadata are replaced by the values sent.
      operationId: updateSecret
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSecretRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretMetadata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Secrets]
      summary: Delete secret
      description: Requires write permission. The secret is soft-deleted.
      operationId: deleteSecret
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /secrets/{id}/reveal:
    parameters:
      - $ref: '#/components/parameters/SecretIdPath'
    post:
      tags: [Secrets]
      summary: Reveal secret value
      description: Requires reveal permission (owner, admin or on-call). Every reveal is recorded in the audit log.
      operationId: revealSecret
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Decrypted value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretReveal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /secrets/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/SecretIdPath'
    get:
      tags: [Secrets]
      summary: List secret versions
      description: |
        Every value the secret has had, newest first, without the values. A new version is added
        each time the value changes or an earlier version is restored. Requires read permission.
      operationId: listSecretVersions
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SecretVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /secrets/{id}/versions/{version}/reveal:
    parameters:
      - $ref: '#/components/parameters/SecretIdPath'
      - $ref: '#/components/parameters/VersionPath'
    post:
      tags: [Secrets]
      summary: Reveal an earlier value
      description: Requires reveal permission. Audited as `secret.revealed` with the version number.
      operationId: revealSecretVersion
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Decrypted value of that version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretReveal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /secrets/{id}/versions/{version}/restore:
    parameters:
      - $ref: '#/components/parameters/SecretIdPath'
      - $ref: '#/components/parameters/VersionPath'
    post:
      tags: [Secrets]
      summary: Roll back to an earlier value
      description: |
        Makes the value of an earlier version current again by adding it as a new version, so
        history is never rewritten. Requires write permission. Audited as `secret.restored`.
      operationId: restoreSecretVersion
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: The secret with its new current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretMetadata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The version is already current (`version_is_current`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /vaults/{id}/members:
    parameters:
      - $ref: '#/components/parameters/VaultIdPath'
    get:
      tags: [Members]
      summary: List members
      description: Explicit vault members. Requires read permission.
      operationId: listMembers
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Members]
      summary: Add member
      description: Requires manage-members permission. The user must already belong to the vault's organization. Only owners can add another owner.
      operationId: addMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMemberRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          description: Invalid role or the user is not in the organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Vault not found, or no user with that email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }

  /vaults/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/VaultIdPath'
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Members]
      summary: Change member role
      description: Requires manage-members permission. Only owners can grant or change the owner role, and the last owner cannot be demoted.
      operationId: updateMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRequest' }
      responses:
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Members]
      summary: Remove member
      description: Requires manage-members permission. Callers cannot remove themselves, only owners can remove an owner, and the last owner cannot be removed.
      operationId: removeMember
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audit:
    get:
      tags: [Audit]
      summary: Query the audit log
      description: |
        Newest first. Callers see their own events, every event in organizations they own or
        administer, and events in vaults where they are an owner or admin. snake_case aliases
        (`vault_id`, `user_id`, `org_id`, `environment_id`, `start_time`, `end_time`) are also accepted.
      operationId: listAuditEvents
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: vaultId
          in: query
          schema: { type: string, format: uuid }
        - name: environmentId
          in: query
          schema: { type: string, format: uuid }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: userEmail
          in: query
          description: Case-insensitive substring of the actor's email
          schema: { type: string }
        - name: action
          in: query
          schema: { $ref: '#/components/schemas/AuditAction' }
        - name: excludeAction
          in: query
          description: Leave out events with this action; repeat for several
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/AuditAction' }
        - name: startDate
          in: query
          description: Inclusive; RFC 3339 timestamp or YYYY-MM-DD (UTC midnight)
          schema: { type: string }
        - name: endDate
          in: query
          description: Exclusive for timestamps; a YYYY-MM-DD day includes that whole day
          schema: { type: string }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: One page of events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search:
    get:
      tags: [Dashboard]
      summary: Search secrets by key name
      description: |
        Case-insensitive substring match on key names across every vault the caller can read,
        newest matches first, at most 50 results. Only names and metadata are returned, never
        values, so read permission is enough and nothing is audited.
      operationId: searchSecrets
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 255 }
        - name: organizationId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Limit the search to one organization
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Matching secrets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /stats:
    get:
      tags: [Dashboard]
      summary: Dashboard statistics
      description: Counts across the vaults the caller can access.
      operationId: getStats
      parameters:
        - name: organizationId
          in: query
          description: Only include this organization (snake_case `organization_id` is also accepted)
          schema: { type: string, format: uuid }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /alerts:
    get:
      tags: [Dashboard]
      summary: Dashboard alerts
      description: Expired and soon-expiring (7 days) secrets and overdue rotations in accessible vaults, and members without a login in 90 days in vaults the caller manages. Ordered by severity, at most 50.
      operationId: listAlerts
      parameters:
        - name: organizationId
          in: query
          description: Only include this organization (snake_case `organization_id` is also accepted)
          schema: { type: string, format: uuid }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DashboardAlert' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: A service token (dsm_st_...) created for one environment.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token from /auth/login or /auth/refresh (15 minutes by default).

  parameters:
    OrganizationIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VaultIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnvironmentIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionPath:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SecretIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    InternalError:
      description: Unexpected server error (`internal_error`); details are logged, never returned
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded (`rate_limited`), or for login an account temporarily locked after repeated failures (`account_locked`); retry after the number of seconds in Retry-After
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Request body larger than 1 MiB (`body_too_large`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid ID, query parameter or body (`invalid_request`), or a field breaking the input rules (`validation_failed`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The caller's role does not allow this action (`forbidden`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found, or the caller has no access to it (`not_found`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: A resource with that name already exists (`duplicate` or `conflict`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable code, e.g. not_found, forbidden, invalid_request
          example: not_found
        message:
          type: string
          example: Vault not found

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Role:
      type: string
      enum: [owner, admin, developer, oncall, viewer]

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        name: { type: string }
        invite_token:
          type: string
          description: Joins the invited organization instead of creating a personal one; the email must match the invitation and no verification is needed

    RegisterResponse:
      type: object
      required: [user_id, message, verification_required]
      properties:
        user_id: { type: string, format: uuid }
        message: { type: string }
        verification_required:
          type: boolean
          description: False when an invitation was accepted and the account can log in straight away

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        use_cookie:
          type: boolean
          description: Set the refresh token as an HttpOnly cookie instead of returning it (default false)

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Omit to use the refresh cookie
        use_cookie:
          type: boolean
          description: Return the new refresh token as a cookie even though one was sent in the body (default false)

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Omit to use the refresh cookie

    AuthTokens:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token:
          type: string
          description: Absent when the refresh token was set as a cookie
        expires_in:
          type: integer
          description: Access token lifetime in seconds

    Session:
      type: object
      required: [id, created_at, last_used_at, expires_at, ip_address, user_agent, current]
      properties:
        id: { type: string, format: uuid }
        created_at:
          type: string
          format: date-time
          description: When the user logged in
        last_used_at:
          type: string
          format: date-time
          description: Last login or token refresh
        expires_at:
          type: string
          format: date-time
          description: When the session ends unless refreshed
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        current: { type: boolean }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 12, maxLength: 72 }

    UserOrganization:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    UserProfile:
      type: object
      required: [id, email, name, created_at, organizations]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        created_at: { type: string, format: date-time }
        organizations:
          type: array
          items: { $ref: '#/components/schemas/UserOrganization' }

    Organization:
      type: object
      required: [id, name, role, member_count, vault_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role:
          $ref: '#/components/schemas/Role'
        member_count: { type: integer }
        vault_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Invite:
      type: object
      required: [id, organization_id, organization_name, email, role, invited_by, invited_by_id, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        organization_name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        invited_by: { type: string }
        invited_by_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    CreateInviteResponse:
      type: object
      required: [id, organization_id, organization_name, email, role, invited_by, invited_by_id, created_at, expires_at, email_sent]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        organization_name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        invited_by: { type: string }
        invited_by_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        email_sent: { type: boolean }

    CreateInviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }

    InviteTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    InviteLookup:
      type: object
      required: [organization_name, email, role, invited_by, expires_at, account_exists]
      properties:
        organization_name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        invited_by: { type: string }
        expires_at: { type: string, format: date-time }
        account_exists:
          type: boolean
          description: Whether an account with the invited address exists (log in to accept) or not (register)

    UpdateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    OrganizationMember:
      type: object
      required: [user_id, email, name, role, joined_at, last_login_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        joined_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }

    Vault:
      type: object
      required: [id, organization_id, organization_name, name, description, user_role, secret_count, env_count, created_by_id, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        organization_name: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        user_role:
          $ref: '#/components/schemas/Role'
        secret_count: { type: integer }
        env_count: { type: integer }
        created_by_id: { type: string, format: uuid, nullable: true }
        created_by:
          type: string
          description: Creator's display name; empty when unknown
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VaultKeyRotation:
      type: object
      required: [vault_id, secrets_reencrypted, rotated_at]
      properties:
        vault_id: { type: string, format: uuid }
        secrets_reencrypted:
          type: integer
          description: Secret values re-encrypted, including deleted secrets
        rotated_at: { type: string, format: date-time }

    CreateVaultRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        organization_id: { type: string, format: uuid }

    UpdateVaultRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }

    Environment:
      type: object
      required: [id, vault_id, name, description, created_at, updated_at, secret_count]
      properties:
        id: { type: string, format: uuid }
        vault_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        secret_count:
          type: integer
          description: Live secrets; only filled in by the list endpoint

    EnvironmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
          example: staging
        description: { type: string, nullable: true }

    RotationPolicy:
      type: object
      required: [interval_days, last_rotated_at, next_rotation_at]
      properties:
        interval_days: { type: integer }
        last_rotated_at:
          type: string
          format: date-time
          nullable: true
          description: When the value last changed; null if never since creation
        next_rotation_at:
          type: string
          format: date-time
          description: One interval after the last rotation, or after creation

    SecretMetadata:
      type: object
      required: [id, environment_id, key_name, created_by, created_at, updated_at, last_updated_at, last_updated_by_id, last_updated_by, rotation_policy, version]
      properties:
        id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        key_name: { type: string }
        description: { type: string }
        rotation_interval_days: { type: integer }
        expires_at: { type: string, format: date-time }
        last_rotated_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_updated_at: { type: string, format: date-time }
        last_updated_by_id: { type: string, format: uuid, nullable: true }
        last_updated_by:
          type: string
          description: Display name of the last editor
        rotation_policy:
          allOf:
            - $ref: '#/components/schemas/RotationPolicy'
          nullable: true
        version:
          type: integer
          description: Number of the current value; it increases each time the value changes

    ExportedSecret:
      type: object
      required: [key, value, expires_at]
      properties:
        key: { type: string }
        value: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }

    SearchResult:
      type: object
      required: [secret_id, key_name, description, vault_id, vault_name, environment_id, environment_name, updated_at]
      properties:
        secret_id: { type: string, format: uuid }
        key_name: { type: string }
        description: { type: string, nullable: true }
        vault_id: { type: string, format: uuid }
        vault_name: { type: string }
        environment_id: { type: string, format: uuid }
        environment_name: { type: string }
        updated_at: { type: string, format: date-time }

    ImportResult:
      type: object
      required: [created, updated, unchanged, skipped, dry_run]
      properties:
        created: { type: array, items: { type: string } }
        updated: { type: array, items: { type: string } }
        unchanged:
          type: array
          items: { type: string }
          description: Existing keys that already have the imported value
        skipped:
          type: array
          items: { type: string }
          description: Existing keys left alone because overwrite was off
        dry_run: { type: boolean }

    SecretVersion:
      type: object
      required: [version, created_at, created_by_id, created_by, restored_from, current]
      properties:
        version: { type: integer }
        created_at: { type: string, format: date-time }
        created_by_id: { type: string, format: uuid, nullable: true }
        created_by:
          type: string
          description: Display name of whoever set this value; empty when unknown
        restored_from:
          type: integer
          nullable: true
          description: The earlier version this one was restored from
        current: { type: boolean }

    CreateSecretRequest:
      type: object
      required: [key_name, value]
      properties:
        key_name: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$', maxLength: 255 }
        value: { type: string, format: password, description: 'At most 64 KiB' }
        description: { type: string, nullable: true, maxLength: 1000 }
        rotation_interval_days: { type: integer, nullable: true, minimum: 1, maximum: 3650 }
        expires_at: { type: string, format: date-time, nullable: true }
        metadata:
          type: object
          description: Up to 50 labels; keys up to 100 characters, string values up to 500
          additionalProperties: { type: string }
          nullable: true

    UpdateSecretRequest:
      type: object
      properties:
        value:
          type: string
          format: password
          description: New value; omit to keep the current one
        description: { type: string, nullable: true }
        rotation_interval_days: { type: integer, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true

    SecretReveal:
      type: object
      required: [id, key_name, value, expires_in]
      properties:
        id: { type: string, format: uuid }
        key_name: { type: string }
        value: { type: string }
        expires_in:
          type: integer
          description: Seconds clients should show the value before hiding it

    MemberPermissions:
      type: object
      required: [can_read, can_write, can_reveal, can_manage_members, can_delete]
      properties:
        can_read: { type: boolean }
        can_write: { type: boolean }
        can_reveal: { type: boolean }
        can_manage_members: { type: boolean }
        can_delete: { type: boolean }

    Member:
      type: object
      required: [user_id, email, name, role, permissions, added_at, added_by, added_by_id]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        permissions: { $ref: '#/components/schemas/MemberPermissions' }
        added_at: { type: string, format: date-time }
        added_by:
          type: string
          description: Display name of whoever added the member; empty when unknown
        added_by_id: { type: string, format: uuid, nullable: true }

    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }

    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }

    ServiceToken:
      type: object
      required: [id, name, prefix, environment_id, environment_name, vault_id, vault_name, created_by, created_at, expires_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix:
          type: string
          description: The first characters of the token, to recognise it
        environment_id: { type: string, format: uuid }
        environment_name: { type: string }
        vault_id: { type: string, format: uuid }
        vault_name: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }

    CreatedServiceToken:
      type: object
      required: [id, name, prefix, environment_id, environment_name, vault_id, vault_name, created_by, created_at, expires_at, last_used_at, token]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        environment_id: { type: string, format: uuid }
        environment_name: { type: string }
        vault_id: { type: string, format: uuid }
        vault_name: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        token:
          type: string
          description: The token itself. Shown only once.

    CreateServiceTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_in_days: { type: integer, minimum: 1, maximum: 365, nullable: true }

    TokenSecrets:
      type: object
      required: [vault_name, environment_name, token_name, secrets]
      properties:
        vault_name: { type: string }
        environment_name: { type: string }
        token_name: { type: string }
        secrets:
          type: array
          items:
            type: object
            required: [key, value, expires_at]
            properties:
              key: { type: string }
              value: { type: string }
              expires_at:
                type: string
                format: date-time
                nullable: true
                description: When the value expires; expired values are still returned so callers can warn

    AuditAction:
      type: string
      enum:
        - login.success
        - login.failure
        - login.locked
        - secret.created
        - secret.updated
        - secret.deleted
        - secret.revealed
        - member.added
        - member.removed
        - member.role_changed
        - vault.created
        - vault.updated
        - vault.deleted
        - vault.key_rotated
        - env.created
        - env.updated
        - env.deleted
        - org.updated
        - org.member_role_changed
        - org.member_removed
        - invite.created
        - invite.revoked
        - invite.accepted
        - token.created
        - token.revoked
        - env.exported
        - user.password_changed
        - user.sessions_revoked
        - user.password_reset
        - secret.restored
        - env.imported

    AuditEvent:
      type: object
      required: [id, timestamp, action, user_id, user_email, service_token_id, organization_id, vault_id, vault_name, environment_id, environment_name, target_type, target_id, target_name, ip_address, user_agent, metadata]
      properties:
        id: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        action: { $ref: '#/components/schemas/AuditAction' }
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Null when a service token acted
        user_email:
          type: string
          description: The actor's email, or token:<name> for a service token
        service_token_id: { type: string, format: uuid, nullable: true }
        organization_id: { type: string, format: uuid, nullable: true }
        vault_id: { type: string, format: uuid, nullable: true }
        vault_name: { type: string, nullable: true }
        environment_id: { type: string, format: uuid, nullable: true }
        environment_name: { type: string, nullable: true }
        target_type:
          type: string
          description: secret, environment, vault, member, organization, invite, service_token or user
        target_id: { type: string, format: uuid, nullable: true }
        target_name: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true

    AuditEventPage:
      type: object
      required: [data, total, page, limit, has_more]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }

    DashboardStats:
      type: object
      required: [vaults, environments, secrets, secrets_expired, secrets_expiring_soon, secrets_rotation_overdue, users, active_users, expiring_soon_days, active_window_days]
      properties:
        vaults: { type: integer }
        environments: { type: integer }
        secrets: { type: integer }
        secrets_expired: { type: integer }
        secrets_expiring_soon: { type: integer }
        secrets_rotation_overdue: { type: integer }
        users:
          type: integer
          description: People with access to the caller's vaults
        active_users:
          type: integer
          description: Of those, how many logged in within active_window_days
        expiring_soon_days: { type: integer }
        active_window_days: { type: integer }

    DashboardAlert:
      type: object
      required: [type, severity, message, vault_id, vault_name, environment_name, target_id, target_name, due_at]
      properties:
        type:
          type: string
          enum: [secret_expired, secret_expiring, rotation_overdue, member_inactive]
        severity:
          type: string
          enum: [high, medium, low]
        message: { type: string }
        vault_id: { type: string, format: uuid }
        vault_name: { type: string }
        environment_name: { type: string, nullable: true }
        target_id: { type: string }
        target_name: { type: string }
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Expiry or rotation due date, or the member's last login (null if never)

    Health:
      type: object
      required: [status, database, migration_version, migration_dirty, started_at, uptime_seconds, version, timestamp]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          example: ok
        migration_version: { type: integer, nullable: true }
        migration_dirty: { type: boolean }
        started_at: { type: string, format: date-time }
        uptime_seconds: { type: integer }
        version: { type: string }
        timestamp: { type: string, format: date-time }
