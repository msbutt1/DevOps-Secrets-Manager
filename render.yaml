# Render blueprint for the API. The web app is served by Cloudflare Pages, which proxies /api to
# this service (see docs/hosting-devops-msbutt-com.md). Secrets are `sync: false`: Render asks
# for them when the blueprint is first applied and keeps them in its own store, never here.
#
# The free plan is chosen deliberately. It cannot bill: when the service is over its limits
# Render stops or throttles it rather than charging, which is the point — an abusive burst costs
# an outage, not money. The cost is a cold start of roughly 50 seconds after 15 minutes idle,
# which the keep-warm ping in the runbook covers.
services:
  - name: msbutt-secrets-api
    type: web
    runtime: docker
    plan: free
    region: virginia # same coast as the Neon project, to keep database round trips short
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: . # the Dockerfile copies go.mod and apps/api from the repository root
    healthCheckPath: /health
    autoDeployTrigger: "off" # deploys are tag-driven from .github/workflows/deploy.yml
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DATABASE_MIGRATIONS_PATH
        value: /app/migrations
      - key: APP_PUBLIC_URL
        value: https://devops.msbutt.com
      # Requests arrive through Cloudflare, then Render's router. Cloudflare writes the real
      # client address into CF-Connecting-IP, which a client cannot prepend a fake hop to.
      - key: APP_CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: APP_TRUSTED_PROXIES
        value: 0.0.0.0/0,::/0
      # APP_SERVER_PORT is deliberately unset: Render sets PORT, and the API prefers it over the
      # port in config.yaml.

      # Asked for on first apply, then held by Render. MASTER_KEK especially: write it down
      # somewhere safe first, because without it every stored secret is unreadable.
      - key: MASTER_KEK
        sync: false
      - key: APP_JWT_SECRET
        sync: false
      # Shared with the Pages Function's EDGE_TOKEN. Without it, msbutt-secrets-api.onrender.com
      # is a public way around Cloudflare's rate limits and the header above.
      - key: APP_EDGE_TOKEN
        sync: false
      # Neon's connection string, pasted whole. It takes precedence over the APP_DATABASE_*
      # fields and already carries sslmode=require. Use the direct endpoint, not the -pooler
      # one: migrations take a session-level advisory lock, which transaction pooling breaks.
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
