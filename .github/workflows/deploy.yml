name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Deployments are manual or tag-driven on purpose: a push to main should not reach production
# before its checks are green.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    name: API (Fly.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --build-arg VERSION=${{ github.ref_name }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Wait for the new version to answer
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "https://${{ vars.API_HOST }}/health" | grep -q '"database":"ok"'; then
              echo "API is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy" >&2
          exit 1

  web:
    name: Web (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name=${{ vars.PAGES_PROJECT }} --branch=main

  verify:
    name: Check the deployment
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-deployment.sh "https://${{ vars.PUBLIC_URL }}"
