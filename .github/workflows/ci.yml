name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secrets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d secrets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/secrets_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint (gofmt, go vet)
        run: make lint-api
      - name: Build
        run: make build-api
      - name: Test
        run: make test-api

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web
      - name: Lint (ESLint, Prettier, OpenAPI types, TypeScript)
        run: make lint-web
      - name: Test
        run: make test-web
      - name: Build
        run: make build-web

  cli:
    name: CLI (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cli
      - name: Lint (rustfmt, clippy)
        run: make lint-cli
      - name: Test
        run: make test-cli
      - name: Build
        run: make build-cli

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Build images
        run: docker compose build
