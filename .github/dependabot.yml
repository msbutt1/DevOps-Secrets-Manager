# Weekly update pull requests. Minor and patch updates are grouped per ecosystem to keep the
# number of PRs manageable; security updates are always raised on their own.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: build(api)

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: build(web)

  - package-ecosystem: cargo
    directory: /apps/cli
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: build(cli)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
