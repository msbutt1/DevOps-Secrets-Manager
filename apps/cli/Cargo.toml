[package]
name = "secrets"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "secrets"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "=4.6.10"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = "2.3"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7.1"
rpassword = "7.3"
dirs = "7.0"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.21"

[dev-dependencies]
wiremock = "=0.6.5"
