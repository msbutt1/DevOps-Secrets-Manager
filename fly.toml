# Fly.io configuration for the API. The web app is served by Cloudflare Pages, which proxies
# /api to this app (see docs/deployment.md). Secrets are set with `fly secrets set`, never here.
app = "msbutt-secrets-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  APP_SERVER_PORT = "8080"
  APP_ENV = "production"
  APP_DATABASE_SSLMODE = "require"
  APP_DATABASE_MIGRATIONS_PATH = "/app/migrations"
  # Requests arrive through Cloudflare, then Fly's proxy. Cloudflare writes the real client
  # address into CF-Connecting-IP, which a client cannot prepend to.
  APP_CLIENT_IP_HEADER = "CF-Connecting-IP"
  APP_TRUSTED_PROXIES = "0.0.0.0/0,::/0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
